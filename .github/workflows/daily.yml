name: Daily scan and publish (four times a day)

on:
  schedule:
    # Every 6 hours in smaller batches: a throttled run costs less, and requests are spread out.
    - cron: "17 0,6,12,18 * * *"   # ~4-5pm, 10-11pm, 4-5am, 10-11am Pacific
  push:  # code/site changes: rebuild and publish without a flight scan
    branches: [main]
    paths: ["site/**", "data/**", "build.py", "snow.py", "scan.py", "pricing/**", ".github/workflows/daily.yml"]
  workflow_dispatch:
    inputs:
      budget:
        description: "Max flight searches this run"
        default: "150"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Snow (climate once, then season + 16-day forecast)
        run: python snow.py
        continue-on-error: true
        timeout-minutes: 15
      - name: Flight scan
        # scan.py stops itself at 35 min; the step limit is a backstop, and progress is saved every 25 searches
        timeout-minutes: 40
        continue-on-error: true
        run: python scan.py --budget "${{ github.event_name == 'push' && '0' || github.event.inputs.budget || '150' }}"
      - name: Build page data
        run: python build.py
      - name: Save data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
