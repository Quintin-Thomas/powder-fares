name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["store/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Planner tests (pass math + brute-force check)
        run: node --test tests/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Pipeline tests (scan, snow, El Niño)
        run: python -m unittest discover tests -v
